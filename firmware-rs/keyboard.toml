[keyboard]
name = "jam56s"
product_name = "jam56s"
vendor_id = 0x4A4A
product_id = 0x3536
manufacturer = "jamdotjar"
chip = "rp2040"

[layout]
rows = 4
cols = 14
layers = 2
keymap = [
    [
        ["Kc1", "Kc2", "Kc3", "Kc4", "Kc5", "Kc6", "Kc7", "Kc8", "Kc9", "Kc0"],
        ["Kc1", "Kc2", "Kc3"],
        ["LCtrl", "MO(1)", "LShift"],
        ["OSL(1)", "LT(2, Kc9)", "LM(1, LShift | LGui)"]
    ],
    [
        ["_", "TT(1)", "TG(2)"],
        ["_", "_", "_"],
        ["_", "_", "_"],
        ["_", "_", "_"]
    ],
]

[storage]

[split]
connection = "serial"

[split.central]
rows = 4
cols = 7
row_offset = 0
col_offset = 0
serial = [
    { instance = "UART0", tx_pin = "PIN_17", rx_pin = "PIN_16" },
]
[split.central.matrix]
matrix_type = "normal"
input_pins = ["PIN_0", "PIN_1", "PIN_2", "PIN_3", "PIN_4", "PIN_5", "PIN_6", "PIN_15"] // last col thumb cluster
output_pins = ["PIN_7", "PIN_8", "PIN_9", "PIN_10"]

[[split.peripheral]]
rows = 4
cols = 7
row_offset = 0
col_offset = 7
serial = [{ instance = "UART0", tx_pin = "PIN_17", rx_pin = "PIN_16" }]
[split.peripheral.matrix]
matrix_type = "normal"
input_pins = [, "PIN_14", "PIN_20", "PIN_21", "PIN_22", "PIN_26", "PIN_27", "PIN_28"] /// 1st col thumb cluster
output_pins = ["PIN_19", "PIN_18", "PIN_15", "PIN_14"]

